<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <header class="header">
            <div class="logo">🌤️</div>
            <div>
                <h1>Weather App</h1>
                <p>Your daily weather companion</p>
            </div>
        </header>

        <form class="search-box" id="searchForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                aria-label="City name"
            >
            <button type="submit">Search</button>
        </form>

        <p id="message">Search a city to see its weather.</p>

        <section class="weather-card" id="weatherCard">
            <div class="weather-top">
                <div>
                    <p class="label">CURRENT WEATHER</p>
                    <h2 id="cityName">Lahore</h2>
                    <p id="description">Partly Cloudy</p>
                </div>
                <div class="weather-icon" id="weatherIcon">⛅</div>
            </div>

            <div class="temperature">
                <span id="temperature">28</span><span class="unit">°C</span>
            </div>

            <p class="feels">Feels like <span id="feelsLike">30</span>°C</p>

            <div class="details">
                <div class="detail">
                    <span class="detail-icon">💧</span>
                    <div>
                        <p>Humidity</p>
                        <h3 id="humidity">65%</h3>
                    </div>
                </div>

                <div class="detail">
                    <span class="detail-icon">💨</span>
                    <div>
                        <p>Wind Speed</p>
                        <h3 id="wind">12 km/h</h3>
                    </div>
                </div>
            </div>
        </section>

        <footer>
            <p>Made with ❤️ using HTML, CSS & JavaScript</p>
            <p class="note">Student Weather Project</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
